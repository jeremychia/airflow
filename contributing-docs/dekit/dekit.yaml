# Basic dekit configuration for Airflow
# This is a static example configuration. For dynamic configuration based on
# your environment, use the generate_dekit_config.py script from ../../scripts/in_container/bin.
# Run `dekit up` in the directory with this file to start the tasks, then `dekit` to attach to them.
---
defaults:
  autorestart: always
  scrollback_len: 100000

tasks:
  scheduler:
    cmd: airflow scheduler
    autostart: true

  api_server:
    cmd: airflow api-server
    autostart: true

  triggerer:
    cmd: airflow triggerer
    autostart: true

  dag_processor:
    cmd: airflow dag-processor
    autostart: true

  # # Optional: Uncomment to enable Celery worker (requires CeleryExecutor)
  # celery_worker:
  #   cmd: airflow celery worker
  #   autostart: true

  # # Optional: Uncomment to enable Flower (requires Celery)
  # flower:
  #   cmd: airflow celery flower
  #   autostart: true

  shell:
    cmd: bash
    autostart: true
